# CI/CD Pipeline for myresumeapi
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token (not your account password)
#
# Optional (OWASP Dependency-Check disabled for now):
#   NVD_API_KEY         - NVD API key for OWASP Dependency-Check
#                         https://nvd.nist.gov/developers/request-an-api-key
#
# Triggers:
#   - Pull Request → main: build + Trivy scan (no Docker publish)
#   - Push → main:       build + Trivy scan + Docker publish

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: myresumeapi

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      # TODO: remove -DskipTests when PostgreSQL is available in CI or a test profile is added.
      # The only existing test (MyresumeapiApplicationTests) requires a live PostgreSQL instance.
      - name: Compile and package
        run: ./mvnw clean package -B -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myresumeapi-jar
          path: target/*.jar
          retention-days: 7

  # OWASP Dependency-Check disabled for now. To re-enable:
