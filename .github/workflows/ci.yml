# CI/CD Pipeline for myresumeapi
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  - Docker Hub username only (e.g. cesarrare), not email
#   DOCKERHUB_TOKEN     - Docker Hub access token (Account Settings → Security)
#                         Paste without quotes or trailing spaces/newlines
#
# Optional (OWASP Dependency-Check disabled for now):
#   NVD_API_KEY         - NVD API key for OWASP Dependency-Check
#                         https://nvd.nist.gov/developers/request-an-api-key
#
# Triggers:
#   - Pull Request → main: build + Trivy scan (no Docker publish)
#   - Push → main:       build + Trivy scan + Docker publish

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  #pull_request:
  #  branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: myresumeapi
  KUBE_NAMESPACE: myresume

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      # TODO: remove -DskipTests when PostgreSQL is available in CI or a test profile is added.
      # The only existing test (MyresumeapiApplicationTests) requires a live PostgreSQL instance.
      - name: Compile and package
        run: ./mvnw clean package -B -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myresumeapi-jar
          path: target/*.jar
          retention-days: 7

  # OWASP Dependency-Check disabled for now. To re-enable:
  # 1. Uncomment this job
  # 2. Add dependency-check back to docker.needs
  # 3. Configure NVD_API_KEY secret (recommended)
  #
  # dependency-check:
  #   name: OWASP Dependency Check
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #
  #     - name: Run OWASP Dependency-Check
  #       uses: dependency-check/Dependency-Check_Action@1.1.0
  #       with:
  #         project: myresumeapi
  #         path: .
  #         format: HTML
  #         out: reports
  #         args: >
  #           --failOnCVSS 7
  #           --enableRetired
  #           --nvdApiKey ${{ secrets.NVD_API_KEY }}
  #
  #     - name: Upload Dependency-Check report
  #       uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: dependency-check-report
  #         path: reports
  #         retention-days: 14

  # trivy-fs:
  #   name: Trivy Filesystem Scan
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Run Trivy vulnerability scanner (filesystem)
  #       uses: aquasecurity/trivy-action@0.36.0
  #       with:
  #         scan-type: fs
  #         scan-ref: .
  #         format: table
  #         exit-code: "1"
  #         ignore-unfixed: true
  #         vuln-type: os,library
  #         severity: CRITICAL,HIGH

  docker:
    name: Build, Scan & Publish Docker Image
    runs-on: ubuntu-latest
    #needs: [build, trivy-fs]
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          USERNAME="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          TOKEN="$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '[:space:]')"

          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "Docker Hub credentials are missing."
            echo "Configure repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
            exit 1
          fi


          printf '%s' "$TOKEN" | docker login -u "$USERNAME" --password-stdin

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # - name: Scan Docker image with Trivy
      #   uses: aquasecurity/trivy-action@0.28.0
      #   with:
      #     image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      #     format: table
      #     exit-code: "1"
      #     ignore-unfixed: true
      #     vuln-type: os,library
      #     severity: CRITICAL,HIGH

      - name: Push Docker image to Docker Hub
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"


      - name: Configure Kubernetes
        run: |
          mkdir -p $HOME/.kube

          cat <<EOF > $HOME/.kube/config
          apiVersion: v1
          kind: Config
          clusters:
          - name: kubernetes
            cluster:
              server: ${KUBE_SERVER}
              certificate-authority-data: ${KUBE_CA_CERT}

          contexts:
          - name: github-actions
            context:
              cluster: kubernetes
              namespace: ${KUBE_NAMESPACE}
              user: github-actions

          current-context: github-actions

          users:
          - name: github-actions
            user:
              token: ${KUBE_TOKEN}
          EOF

          chmod 600 $HOME/.kube/config

        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
  
      - name: Validate Kubernetes connection
        run: |
          #kubectl cluster-info
          kubectl auth can-i create deployments
          kubectl auth can-i create secrets
          kubectl auth can-i create ingresses

      - name: Deploy application
        run: |
          sed -i "s|IMAGE_NAME_TAG|${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml
          kubectl apply \
            -f k8s/ \
            --namespace=${KUBE_NAMESPACE}

      - name: Wait for deployment
        run: |
          kubectl rollout status \
            deployment/myresumeapi \
            --namespace=${KUBE_NAMESPACE} \
            --timeout=300s
