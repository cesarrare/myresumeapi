spring:
  config:
    # Local-only secrets (git-ignored). In CI/prod use GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
    import: "optional:classpath:application.local.yml"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myresumedb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

server:
  error:
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:myresume-dev-only-secret-key-min-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  cors:
    # Comma-separated. Override with CORS_ALLOWED_ORIGINS in k8s if needed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://myresumeapp.k8s.sftcloud.com.mx}
